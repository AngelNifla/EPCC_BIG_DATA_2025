############################# Broker Basics #############################
# Node ID único en el cluster KRaft
node.id=1

# Puerto para clientes Kafka (KRaft separado de Kafka clásico)
listeners=PLAINTEXT://kafka-nodo01:9192,CONTROLLER://kafka-nodo01:9193
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
# Roles habilitados para KRaft
process.roles=broker,controller

# Votantes del quorum de controllers (usa los 3 nodos)
controller.quorum.voters=1@kafka-nodo01:9193,2@kafka-nodo02:9193,3@kafka-nodo03:9193,4@kafka-nodo04:9193,5@kafka-nodo05:9193

############################# Network Settings #############################
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Log Basics #############################
# Carpeta de logs independiente para KRaft
log.dirs=/tmp/kafka-logs-kraft

num.partitions=1
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
log.retention.hours=168
log.retention.check.interval.ms=300000


############################# Group Coordinator Settings #############################
group.initial.rebalance.delay.ms=0
